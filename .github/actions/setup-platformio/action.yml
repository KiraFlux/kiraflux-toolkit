name: Setup PlatformIO
description: Cache PlatformIO state, set up Python, install PlatformIO Core

runs:
  using: "composite"
  steps:
    - name: Cache PlatformIO and pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/platformio
          ~/.platformio/.cache
          ~/.platformio/packages
          ~/.platformio/platforms
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', 'library.json') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO Core
      shell: bash
      run: pip install --upgrade platformio
